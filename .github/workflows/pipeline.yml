on:
  schedule:
    - cron: '15 17 * * *'
  workflow_dispatch:

jobs: 
  scheduled-job: # Correção ortográfica de 'encheduled-job'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Obrigatório para baixar todo o histórico do Git

      - name: Informações do schedule
        run: | 
          echo "Workflow disparado por schedule"
          echo "Data atual local do runner: $(date)"
          echo "Hora UTC: $(date -u)"
          echo "Timezone: $(date +%Z)"

      - name: Relatório diário automatizado
        run: | 
          echo "Relatório diário automatizado"
          echo "==============="
          echo "Total de commits: $(git rev-list --all --count)"
          echo "Contribuidores únicos: $(git log --format='%an' | sort -u | wc -l)"
          echo "Último commit: $(git log -1 --pretty=format:'%h - %s (%an, %ar)')" # Correção de '$s' para '%s'
